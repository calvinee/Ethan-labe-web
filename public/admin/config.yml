locale: "zh_Hans"
site_url: "https://shi-fpga-lab.shi-fpga-lab.workers.dev"
display_url: "https://shi-fpga-lab.shi-fpga-lab.workers.dev"

# 本地模式会由 decap-server 接管；远程模式还需配置 GitHub OAuth 代理。
local_backend: true
publish_mode: "simple"
backend:
  name: "github"
  repo: "calvinee/Ethan-labe-web"
  branch: "main"
  base_url: "https://shi-fpga-lab-cms-auth.shi-fpga-lab.workers.dev"
  auth_endpoint: "/auth"
  squash_merges: true
  commit_messages:
    create: "content: 新建 {{collection}}「{{slug}}」"
    update: "content: 更新 {{collection}}「{{slug}}」"
    delete: "content: 删除 {{collection}}「{{slug}}」"
    uploadMedia: "content: 上传媒体「{{path}}」"
    deleteMedia: "content: 删除媒体「{{path}}」"

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "site_settings"
    label: "网站与首页"
    format: "json"
    editor:
      preview: false
    files:
      - name: "home_visuals"
        label: "首页视觉设置"
        file: "content/settings/home.json"
        fields:
          - { label: "首页封面图", name: "heroImage", widget: "image", hint: "替换首页右侧 FPGA 实拍封面。建议使用横图，宽度至少 1200px。" }
          - { label: "封面图说明", name: "heroAlt", widget: "string", hint: "用于无障碍阅读和图片无法显示时的说明。" }
          - { label: "首页背景图", name: "backgroundImage", widget: "image", required: false, hint: "可从媒体库的 backgrounds 目录选择，也可上传新图片。" }
          - label: "默认背景风格"
            name: "backgroundStyle"
            widget: "select"
            default: "nebula"
            options:
              - { label: "清爽阅读（不显示图片）", value: "clean" }
              - { label: "星云作品（图片柔和融入）", value: "nebula" }
              - { label: "深空展示（暗色沉浸）", value: "deep-space" }
              - { label: "工程电路（技术网格）", value: "blueprint" }
              - { label: "AI 极光（渐变氛围）", value: "aurora" }
          - label: "背景焦点位置"
            name: "backgroundPosition"
            widget: "select"
            default: "right top"
            options:
              - { label: "右上", value: "right top" }
              - { label: "居中靠上", value: "center top" }
              - { label: "左上", value: "left top" }
              - { label: "正中", value: "center center" }
          - label: "阅读遮罩强度"
            name: "overlayStrength"
            widget: "select"
            default: "balanced"
            hint: "背景越复杂，越建议使用均衡或强遮罩。"
            options:
              - { label: "柔和", value: "soft" }
              - { label: "均衡（推荐）", value: "balanced" }
              - { label: "强遮罩", value: "strong" }
          - { label: "允许访客切换场景背景", name: "showBackgroundSwitcher", widget: "boolean", default: true }
          - label: "能力背书"
            name: "credentials"
            widget: "list"
            min: 1
            max: 5
            summary: "{{fields.label}} · {{fields.title}}"
            hint: "显示在 GitHub 贡献图下方。桌面端最多五列；建议每项只保留一条核心结论。"
            fields:
              - { label: "分类", name: "label", widget: "string", hint: "例如：量产工程、行业经历、荣誉奖项。" }
              - { label: "核心结论", name: "title", widget: "string", hint: "短句展示，不写职位和时间线。" }
              - { label: "补充说明", name: "description", widget: "string", hint: "灰白小字，避免论文长标题和冗长描述。" }
      - name: "blog_editorial"
        label: "工程杂志设置"
        file: "content/settings/blog.json"
        fields:
          - { label: "杂志名称", name: "journalTitle", widget: "string" }
          - { label: "英文副题", name: "journalSubtitle", widget: "string" }
          - { label: "杂志简介", name: "journalDescription", widget: "text" }
          - { label: "Notes 标题", name: "notesTitle", widget: "string" }
          - { label: "Notes 简介", name: "notesDescription", widget: "text" }
          - { label: "About 标题", name: "aboutTitle", widget: "string" }
          - { label: "About 开场", name: "aboutIntro", widget: "text" }
          - { label: "内容使命", name: "mission", widget: "text" }
          - { label: "作者方向", name: "authorIntro", widget: "text", hint: "不写姓名、职位和公司时间线。" }
          - { label: "联系说明", name: "contactText", widget: "text" }
          - { label: "GitHub 地址", name: "githubUrl", widget: "string" }
          - label: "能力背书"
            name: "credentials"
            widget: "list"
            min: 1
            max: 5
            summary: "{{fields.title}}"
            fields:
              - { label: "标题", name: "title", widget: "string" }
              - { label: "简短说明", name: "description", widget: "string" }

  - name: "blog"
    label: "工程文章"
    label_singular: "文章"
    folder: "content/blog"
    extension: "mdx"
    format: "frontmatter"
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{date}} · {{category}} · {{title}}"
    sortable_fields: ["date", "title", "category", "featured", "draft"]
    view_filters:
      - label: "首页主推"
        field: "featured"
        pattern: true
      - label: "草稿"
        field: "draft"
        pattern: true
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "摘要", name: "description", widget: "text", hint: "用于首页卡片、搜索结果和 SEO。" }
      - { label: "发布日期", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { label: "作者", name: "author", widget: "string", default: "时工" }
      - { label: "栏目", name: "category", widget: "string", default: "FPGA 实战" }
      - { label: "标签", name: "tags", widget: "list", default: ["FPGA"] }
      - { label: "阅读时长", name: "reading", widget: "string", default: "10 分钟阅读" }
      - label: "封面视觉"
        name: "visual"
        widget: "select"
        default: "fpga"
        options:
          - { label: "FPGA / 蓝", value: "fpga" }
          - { label: "AI 硬件 / 蓝", value: "ai" }
          - { label: "时序 / 青", value: "timing" }
          - { label: "市场 / 紫", value: "market" }
          - { label: "板卡 / 绿", value: "board" }
          - { label: "交付 / 橙", value: "delivery" }
      - { label: "文章封面图", name: "coverImage", widget: "image", required: false, hint: "用于杂志主页与文章详情。推荐 16:10 或 4:3 横图，至少 1200px 宽。未上传时自动使用工程图形封面。" }
      - { label: "封面图说明", name: "coverAlt", widget: "string", required: false, hint: "简洁说明图片内容，用于无障碍阅读。" }
      - { label: "首页主推", name: "featured", widget: "boolean", default: false, hint: "建议始终只保留一篇主推文章。" }
      - { label: "草稿", name: "draft", widget: "boolean", default: false, hint: "默认直接发布；如需暂存且不公开，请开启草稿。" }
      - { label: "喜欢数", name: "likes", widget: "number", value_type: "int", min: 0, default: 0 }
      - { label: "评论数", name: "comments", widget: "number", value_type: "int", min: 0, default: 0 }
      - { label: "收藏数", name: "saves", widget: "number", value_type: "int", min: 0, default: 0 }
      - { label: "正文", name: "body", widget: "markdown", modes: ["rich_text", "raw"], required: true }

  - name: "blog_notes"
    label: "Notes 短笔记"
    label_singular: "Note"
    folder: "content/blog-notes"
    extension: "mdx"
    format: "frontmatter"
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{date}} · {{category}} · {{title}}"
    sortable_fields: ["date", "title", "category", "pinned", "draft"]
    view_filters:
      - label: "置顶"
        field: "pinned"
        pattern: true
      - label: "草稿"
        field: "draft"
        pattern: true
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "一句话摘要", name: "description", widget: "text" }
      - { label: "发布日期", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { label: "分类", name: "category", widget: "string", default: "工程判断" }
      - { label: "标签", name: "tags", widget: "list", default: ["FPGA"] }
      - { label: "置顶", name: "pinned", widget: "boolean", default: false }
      - { label: "配图", name: "image", widget: "image", required: false }
      - { label: "相关链接", name: "linkUrl", widget: "string", required: false }
      - { label: "链接文案", name: "linkLabel", widget: "string", required: false }
      - { label: "草稿", name: "draft", widget: "boolean", default: false }
      - { label: "正文", name: "body", widget: "markdown", modes: ["rich_text", "raw"], required: true }

  - name: "mindmaps"
    label: "思维导图"
    label_singular: "导图"
    folder: "content/mindmaps"
    extension: "mdx"
    format: "frontmatter"
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{date}} · {{category}} · {{title}}"
    sortable_fields: ["date", "title", "category", "draft"]
    view_filters:
      - label: "草稿"
        field: "draft"
        pattern: true
    fields:
      - { label: "导图标题", name: "title", widget: "string" }
      - { label: "导图摘要", name: "description", widget: "text", hint: "用于独立思维导图索引、搜索和 SEO。" }
      - { label: "更新日期", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { label: "栏目", name: "category", widget: "string", default: "工程方法" }
      - label: "强调色"
        name: "accent"
        widget: "select"
        default: "blue"
        options:
          - { label: "工程蓝", value: "blue" }
          - { label: "高速青", value: "cyan" }
          - { label: "AI 紫", value: "violet" }
          - { label: "交付橙", value: "orange" }
      - { label: "中心主题", name: "center", widget: "string", hint: "建议 6—12 个字。" }
      - label: "主分支"
        name: "branches"
        widget: "list"
        min: 2
        max: 4
        summary: "{{fields.title}}"
        fields:
          - { label: "分支标题", name: "title", widget: "string" }
          - { label: "分支说明", name: "summary", widget: "text" }
          - { label: "关键节点", name: "children", widget: "list", min: 1, field: { label: "节点", name: "item", widget: "string" } }
      - { label: "草稿", name: "draft", widget: "boolean", default: false }
      - { label: "导图详解", name: "body", widget: "markdown", modes: ["rich_text", "raw"], required: true }

  - name: "products"
    label: "产品项目"
    label_singular: "产品"
    folder: "content/products"
    extension: "mdx"
    format: "frontmatter"
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{order}} · {{status}} · {{title}}"
    sortable_fields: ["order", "date", "title", "status", "draft"]
    view_filters:
      - label: "草稿"
        field: "draft"
        pattern: true
      - label: "已发布"
        field: "draft"
        pattern: false
    fields:
      - { label: "产品名称", name: "title", widget: "string" }
      - { label: "卡片摘要", name: "description", widget: "text", hint: "用于产品列表、搜索和 SEO。" }
      - { label: "更新日期", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { label: "英文眉题", name: "eyebrow", widget: "string", default: "FPGA PRODUCT" }
      - { label: "规格摘要", name: "meta", widget: "string", hint: "例如：Verilog · 文档 · Testbench。" }
      - { label: "交付状态", name: "status", widget: "string", default: "现货交付" }
      - { label: "价格说明", name: "price", widget: "string", required: false, default: "联系咨询" }
      - { label: "分类与标签", name: "tags", widget: "list", default: ["FPGA"] }
      - label: "卡片图标"
        name: "icon"
        widget: "select"
        default: "cpu"
        options:
          - { label: "处理器 / AI", value: "cpu" }
          - { label: "高速接口", value: "radio" }
          - { label: "板卡 / PCB", value: "board" }
          - { label: "IP / 数据通路", value: "layers" }
          - { label: "带宽 / 性能", value: "gauge" }
          - { label: "器件 / 模块", value: "package" }
          - { label: "方案设计", value: "boxes" }
      - { label: "显示顺序", name: "order", widget: "number", value_type: "int", min: 0, default: 100, hint: "数字越小越靠前。" }
      - { label: "草稿", name: "draft", widget: "boolean", default: true, hint: "关闭后才会进入产品页、搜索和 sitemap。" }
      - { label: "产品详情", name: "body", widget: "markdown", modes: ["rich_text", "raw"], required: true }

  - name: "learning"
    label: "系统学习"
    label_singular: "学习单元"
    folder: "content/learn"
    extension: "mdx"
    format: "frontmatter"
    create: true
    delete: true
    slug: "{{slug}}"
    summary: "{{order}} · {{status}} · {{title}}"
    sortable_fields: ["order", "date", "title", "status", "draft"]
    view_filters:
      - label: "草稿"
        field: "draft"
        pattern: true
      - label: "已发布"
        field: "draft"
        pattern: false
    fields:
      - { label: "课程/阶段名称", name: "title", widget: "string" }
      - { label: "学习摘要", name: "description", widget: "text", hint: "用于学习路线卡片、搜索和 SEO。" }
      - { label: "更新日期", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { label: "阶段与周期", name: "eyebrow", widget: "string", default: "STAGE 01 · 2 周" }
      - { label: "课时与验收", name: "meta", widget: "string", default: "8 课时 · 2 个验收实验" }
      - { label: "学习级别", name: "status", widget: "string", default: "核心" }
      - { label: "价格/开放说明", name: "price", widget: "string", required: false, default: "" }
      - { label: "分类与标签", name: "tags", widget: "list", default: ["学习路线"] }
      - label: "卡片图标"
        name: "icon"
        widget: "select"
        default: "code"
        options:
          - { label: "RTL / 代码", value: "code" }
          - { label: "时序 / CDC", value: "scan" }
          - { label: "总线 / 存储", value: "layers" }
          - { label: "板级 / 调试", value: "board" }
          - { label: "项目 / 交付", value: "rocket" }
      - { label: "显示顺序", name: "order", widget: "number", value_type: "int", min: 0, default: 100, hint: "数字越小越靠前。" }
      - { label: "草稿", name: "draft", widget: "boolean", default: true, hint: "关闭后才会进入学习页、搜索和 sitemap。" }
      - { label: "课程/阶段详情", name: "body", widget: "markdown", modes: ["rich_text", "raw"], required: true }
